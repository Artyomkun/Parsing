peerDependencyRules:
  ignoreMissing:
    - typescript
  allowedVersions:
    typescript: '7'
allowBuilds:
  '@swc/core': true
  aws-sdk: true
  bcrypt: true
  core-js: true
  core-js-pure: true
  esbuild: true
  ffmpeg-static: true
  ffprobe-static: true
  mongodb-memory-server: true
  sharp: true
  spawn-sync: true
minimumReleaseAgeExclude:
  - kareem@3.4.1
  - mongoose@9.11.2
  - dotenv@18.0.8
  - react-dom@19.3.1
  - react@19.3.1
  - argparse@3.0.3
  - js-yaml@5.5.0
  - markdown-it@15.0.3
  - unpdf@1.9.0
  - webpack@5.112.0
  - "@oxlint/binding-win32-x64-msvc@1.89.0"
  - jose@6.2.13
  - oxfmt@0.74.0
  - oxlint@1.89.0
  - fast-uri@3.1.9
overrides:
  "qs": ">=6.16.1"
  "braces": "npm:picomatch@4.0.7"
  "undici": "7.30.1"
  "fast-uri": "3.1.9"