version: '3.8'
services:
  ai-app:
    build: 
      context: ./ai-app
      dockerfile: Dockerfile
    volumes:
      - ./shared:/app
      - ./ai-app:/app/custom
    working_dir: /app
    ports:
      - "5000:5000"
    command: sleep infinity
    networks:
      - ml-network

  kotlin-api:
    build: 
      context: ./kotlin-api
      dockerfile: Dockerfile
    volumes:
      - ./shared:/app
      - ./kotlin-api:/app/custom
    working_dir: /app
    ports:
      - "8080:8080"
    command: sleep infinity
    networks:
      - ml-network

  python-ml:
    build:
      context: ./python-ml
      dockerfile: Dockerfile
    volumes:
      - ./shared:/app
      - ./python-ml:/app/custom
    working_dir: /app
    ports:
      - "8000:8000"
    command: sleep infinity
    networks:
      - ml-network

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ml_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ml-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge

volumes:
  postgres_data: