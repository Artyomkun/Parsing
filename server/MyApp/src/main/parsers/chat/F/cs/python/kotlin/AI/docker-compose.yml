version: '3.8'
services:
  ai-app:
    build: 
      context: .
      dockerfile: Dockerfile.ai
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "5000:5000"
    command: sleep infinity
    networks:
      - ml-network
    environment:
      - PYTHONPATH=/app
      - POSTGRES_URL=postgres://admin:password@postgres:5432/ml_platform

  kotlin-api:
    build: 
      context: .
      dockerfile: Dockerfile.kotlin
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8080:8080"
    command: sleep infinity
    networks:
      - ml-network
    environment:
      - POSTGRES_URL=postgres://admin:password@postgres:5432/ml_platform

  python-ml:
    image: python:3.13-slim 
    container_name: python-ml-service
    volumes:
      - ./python-ml:/app
    working_dir: /app
    ports:
      - "8000:8000"
    command: sleep infinity
    networks:
      - ml-network
    environment:
      - POSTGRES_URL=postgres://admin:password@postgres:5432/ml_platform

  postgres:
    image: postgres:13
    container_name: ml-database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ml_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ml-network

  redis:
    image: redis:7-alpine
    container_name: ml-cache
    ports:
      - "6379:6379"
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge

volumes:
  postgres_data: