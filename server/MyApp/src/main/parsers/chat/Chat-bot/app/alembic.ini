[alembic]
# path to migration scripts
script_location = core/migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# timezone =

# max length of characters to apply to the
# migration file template (used by `revision --autogenerate`)
# truncate_slug_length = 40

# set to 'true' to run the environment file as a standalone script,
# that is, falling back to a blank connection string instead of the
# application-specific connection string.
# standalone_mode = false

# set to 'true' to use transactions to wrap each migration execution
# transactional_dialects = default

# logging level for the 'alembic' logger
# logging_level = INFO

# set to 'true' to use utc time for migration timestamps
# utc_timestamp = false

# revision environment configuration
[alembic:exclude]
# tables to exclude from --autogenerate
# tables =

[alembic:include]
# object types to include in --autogenerate

[logging]
# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic